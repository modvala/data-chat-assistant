[project]
name = "data-chat-assistant"
version = "0.1.0"
description = "Chat assistant that answers questions about sales data in BigQuery"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "google-genai",
    "google-cloud-bigquery",
    "sqlglot",
    "opentelemetry-sdk",
    "python-dotenv",
    "typer>=0.29.1",
    "rich>=15.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
chat = "dca.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dca"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the real Gemini API and BigQuery. Run with --live.",
]
