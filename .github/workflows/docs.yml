# Builds the simple docs in docs/site/ and publishes them to GitHub Pages (P24).
# A pull request checks the build and runs sync-check. A push to main and a manual run also deploy.
name: Docs site

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      # The sources of the simple docs, for the sync-check job.
      # Keep this list, the grep in sync-check and the source map in
      # .claude/skills/sync-simple-docs/PAGES.md the same.
      - "docs/design/**"
      - "docs/adr/**"
      - "docs/requirements/**"
      - "docs/requirements-coverage.md"
      - "docs/tech-stack.md"
      - ".env.example"
      - "executives.json"
      - "scripts/**"
      - "src/**"
      - "compose.yaml"
      - "docker/**"
      - "config/defaults.toml"
      - "tests/test_live.py"
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gives a warning, not a failure, when a PR changes a source of the simple docs
  # but not docs/site/. It calls no LLM.
  sync-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the simple docs changed with their sources
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          sources=$(printf '%s\n' "$changed" | grep -E '^(docs/design/|docs/adr/|docs/requirements/|docs/requirements-coverage\.md$|docs/tech-stack\.md$|pyproject\.toml$|\.env\.example$|executives\.json$|scripts/|src/|compose\.yaml$|docker/|config/defaults\.toml$|tests/test_live\.py$)' || true)
          site=$(printf '%s\n' "$changed" | grep -E '^docs/site/' || true)
          if [ -n "$sources" ] && [ -z "$site" ]; then
            echo "::warning title=Simple docs not synced::This PR changes sources of docs/site/ but not docs/site/. Run the sync-simple-docs skill. Changed sources: $(echo $sources)"
          else
            echo "The simple docs are in sync with this PR, or no source changed."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-revision-date-localized plugin reads the date of each page from the git history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Build the site
        run: uv run --locked --only-group docs mkdocs build --strict
        env:
          # Hide the end-of-life notice of Material for MkDocs in the build log.
          NO_MKDOCS_2_WARNING: "1"

      # A pull request only checks the build. The other events upload the site for the deploy job.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
